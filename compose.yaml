# TestPoint services.
#
#   docker compose up -d app                          station app on http://localhost:8080
#   docker compose --profile gpu up engine            count reps from CAMERA_URL on the GPU and
#                                                     report them live to the app (docs/ENGINE-LINK.md)
#   docker compose --profile cpu up engine-cpu        same on the CPU (slow, for testing)
#   docker compose --profile gpu run --rm --entrypoint testpoint-demo engine --exercise pushup --source /data/clip.mp4 --out /data/out.mp4
#                                                     the stand-alone demo CLI (annotated video, no app)
#   docker compose --profile test run --rm tests      unit tests
#   docker compose --profile prototype up -d prototype  original mock-up on :8081
#
# Settings come from a .env file next to this one (copy .env.example).

name: testpoint

# Database, evidence videos and lane files live in ./data on the host (/data in the container).
# The engine reports to the app over the compose network and records evidence under /data/evidence.
x-engine: &engine
  entrypoint: ["testpoint-engine"]
  volumes:
    - ./data:/data
  depends_on:
    - app
  restart: unless-stopped

services:
  app:
    build:
      context: .
      target: app
    image: testpoint/app:${TESTPOINT_VERSION:-0.1.0}
    ports:
      - "${APP_PORT:-8080}:8000"
    volumes:
      - ./data:/data
    environment:
      TESTPOINT_TZ: ${TESTPOINT_TZ:-Asia/Dubai}
      # the camera service on the station PC (python -m testpoint.camhost), for the finish camera
      TESTPOINT_CAMHOST: http://host.docker.internal:8099
    restart: unless-stopped

  prototype:
    profiles: [prototype]
    build:
      context: .
      target: prototype
    image: testpoint/prototype:${TESTPOINT_VERSION:-0.1.0}
    ports:
      - "${PROTOTYPE_PORT:-8081}:80"

  engine:
    <<: *engine
    profiles: [gpu]
    build:
      context: .
      target: gpu
      args:
        MODEL_MODES: ${MODEL_MODES:-lightweight balanced}
    image: testpoint/engine-gpu:${TESTPOINT_VERSION:-0.1.0}
    command:
      - --exercise=${EXERCISE:-pushup}
      - --source=${CAMERA_URL:-rtsp://set-CAMERA_URL-in-.env}
      - --lanes=${LANES:-3}
      - --device=cuda
      - --mode=${POSE_MODE:-balanced}
      - --app=http://app:8000
      - --evidence=/data/evidence
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  engine-cpu:
    <<: *engine
    profiles: [cpu]
    build:
      context: .
      target: cpu
      args:
        MODEL_MODES: ${MODEL_MODES:-lightweight balanced}
    image: testpoint/engine-cpu:${TESTPOINT_VERSION:-0.1.0}
    command:
      - --exercise=${EXERCISE:-pushup}
      - --source=${CAMERA_URL:-rtsp://set-CAMERA_URL-in-.env}
      - --lanes=${LANES:-3}
      - --device=cpu
      - --mode=lightweight
      - --app=http://app:8000
      - --evidence=/data/evidence

  tests:
    profiles: [test]
    build:
      context: .
      target: test
    image: testpoint/tests:${TESTPOINT_VERSION:-0.1.0}
