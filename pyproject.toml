[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "testpoint"
version = "0.1.0"
description = "Camera-based fitness test station: push-ups, crunches and run timing"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "rtmlib>=0.0.13",
    "onnxruntime>=1.18",
]

[project.optional-dependencies]
# GPU inference. Verified 2026-10-15 on an RTX 5080 (Blackwell), driver 617.42,
# Windows 11. onnxruntime-gpu 1.31 is built against CUDA 13; the nvidia-* wheels
# provide the CUDA/cuDNN runtime, so no system-wide CUDA toolkit is needed.
# onnxruntime (CPU) and onnxruntime-gpu install into the same package directory
# and rtmlib pulls the CPU wheel in, so follow the swap steps in README.md.
gpu = [
    "onnxruntime-gpu==1.31.0",
    "nvidia-cuda-runtime==13.4.92",
    "nvidia-cuda-nvrtc==13.4.92",
    "nvidia-nvjitlink==13.4.92",
    "nvidia-cublas==13.8.0.4",
    "nvidia-cufft==12.4.0.43",
    "nvidia-curand==10.4.4.72",
    "nvidia-cudnn-cu13==9.27.0.42",
]
# Station app (API + UI). The app image installs only these, not the vision stack,
# plus opencv-python-headless for face check-in (the base opencv-python works too).
app = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "tzdata",
]
# Finish camera: bib OCR on ONNX Runtime (shares the runtime of the pose models).
run = ["rapidocr-onnxruntime>=1.3"]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
testpoint-demo = "testpoint.cli:main"
testpoint-app = "testpoint.api.app:main"
testpoint-engine = "testpoint.engine:main"
testpoint-finishcam = "testpoint.finishcam:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
